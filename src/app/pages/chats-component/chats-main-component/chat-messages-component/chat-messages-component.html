<!-- Messages -->

<div
  #messagesContainer
  class="bg-surface-50 dark:bg-surface-950 scrollbar-thin scrollbar-track-transparent scrollbar-thumb-slate-300/50 hover:scrollbar-thumb-slate-400/70 dark:scrollbar-thumb-slate-700 dark:hover:scrollbar-thumb-slate-600 h-full overflow-y-auto"
>
  @for (message of messages(); track message.messageId) {
    <div class="space-y-4 px-10 py-6 lg:px-14">
      <!-- Date Separator -->
      <!-- <div class="flex justify-center py-4">
              <span
                class="rounded-full bg-slate-100 px-4 py-1.5 text-xs font-medium text-slate-600 ring-1 ring-slate-200 dark:bg-slate-900/60 dark:text-slate-300 dark:ring-slate-700"
              >
                25/01/2023
              </span>
            </div> -->

      @if (message.senderId === currentUserId()) {
        <!-- IsMe Message -->
        <div class="flex justify-end">
          <div
            class="max-w-[75%] rounded-lg rounded-tr-none bg-cyan-600 px-4 py-2 text-sm break-all text-white shadow-sm lg:max-w-[65%] dark:bg-cyan-800"
          >
            <p>{{ message.content }}</p>
            <span class="mt-1 block text-xs text-cyan-100 select-none">
              {{ message.sentAt | date: 'shortTime' }}
            </span>
          </div>
        </div>
      } @else {
        <!-- Other Message -->
        <div class="flex justify-start">
          <div
            class="max-w-[75%] rounded-lg rounded-tl-none bg-white px-4 py-2 text-sm break-all text-gray-800 shadow-sm lg:max-w-[65%] dark:bg-gray-800 dark:text-slate-100 dark:ring-slate-700"
          >
            <p>
              {{ message.content }}
            </p>
            <span class="mt-1 block text-xs text-slate-500 select-none dark:text-slate-400">
              {{ message.sentAt | date: 'shortTime' }}
            </span>
          </div>
        </div>
      }
    </div>
  }
</div>
