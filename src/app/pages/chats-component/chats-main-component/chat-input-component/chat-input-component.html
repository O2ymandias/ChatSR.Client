<div class="border-t-2 border-neutral-200 px-8 py-4 dark:border-neutral-800">
  <!-- Edit Preview Banner -->
  @if (editingMessage()) {
    <div
      class="mb-3 flex items-center justify-between rounded-lg bg-cyan-50 px-4 py-2 dark:bg-cyan-900/20"
    >
      <div class="flex items-center gap-2 overflow-hidden">
        <i class="pi pi-pencil text-sm text-cyan-600 dark:text-cyan-400"></i>
        <div class="flex flex-col overflow-hidden">
          <span class="text-xs font-semibold text-cyan-600 dark:text-cyan-400">Edit message</span>
          <span class="truncate text-xs text-neutral-500 dark:text-neutral-400">
            {{ editingMessage()!.content }}
          </span>
        </div>
      </div>
      <!-- Cancel Edit -->
      <p-button
        icon="pi pi-times"
        [rounded]="true"
        [text]="true"
        severity="secondary"
        size="small"
        (click)="cancelEdit()"
      />
    </div>
  }

  <!-- Reply Preview Banner -->
  @if (replyToMessage()) {
    <div
      class="mb-3 flex items-center justify-between rounded-lg bg-neutral-100 px-4 py-2 dark:bg-neutral-800/60"
    >
      <div class="flex items-center gap-3 overflow-hidden">
        <i class="pi pi-reply shrink-0 text-sm text-cyan-500 dark:text-cyan-400"></i>
        <div class="flex flex-col overflow-hidden">
          <span class="text-xs font-semibold text-cyan-600 dark:text-cyan-400">
            {{ replyToMessage()!.senderDisplayName }}
          </span>
          <span class="truncate text-xs text-neutral-500 dark:text-neutral-400">
            {{ replyToMessage()!.content }}
          </span>
        </div>
      </div>
      <p-button
        icon="pi pi-times"
        [rounded]="true"
        [text]="true"
        severity="secondary"
        size="small"
        (click)="cancelReply()"
      />
    </div>
  }

  <div class="flex items-center justify-between gap-4">
    <!-- Wrapper -->
    <div class="flex w-full flex-col gap-1">
      <div class="relative flex w-full items-center">
        <textarea
          pTextarea
          autoResize
          rows="1"
          placeholder="Type a message"
          class="max-h-40 w-full rounded-lg border px-4 py-2 focus:outline-none"
          [class.border-neutral-300]="charsRemaining() >= 0"
          [class.dark:border-neutral-700]="charsRemaining() >= 0"
          [class.focus:border-cyan-600]="charsRemaining() >= 0"
          [class.dark:focus:border-cyan-700]="charsRemaining() >= 0"
          [class.border-red-500]="charsRemaining() < 0"
          [class.dark:border-red-700]="charsRemaining() < 0"
          (keydown)="onTyping()"
          [(ngModel)]="messageContent"
        ></textarea>
      </div>

      <!-- Character Counter -->
      @if (showCharCount()) {
        <span
          class="self-end text-xs"
          [class.text-red-500]="charsRemaining() < 0"
          [class.text-neutral-400]="charsRemaining() >= 0"
          [class.dark:text-neutral-500]="charsRemaining() >= 0"
        >
          {{ charsRemaining() }}
        </span>
      }
    </div>

    <p-button
      rounded
      [icon]="isEditing() ? 'pi pi-check' : 'pi pi-send'"
      outlined
      [severity]="isEditing() ? 'success' : 'info'"
      (click)="isEditing() ? confirmEdit() : isReplying() ? confirmReply() : sendMessageAsync()"
      [disabled]="invalid()"
    />
  </div>
</div>
